# Deploys the Worker to the EXCS Cloudflare account, not South West Collective.
# Local `wrangler whoami` on this machine is South West Collective, so a bare
# `wrangler deploy` would create hack-sw-website on the wrong account.
#
# Run this only after GitHub secrets are from the EXCS account:
#   CLOUDFLARE_ACCOUNT_ID, CLOUDFLARE_API_TOKEN,
#   FORMSPREE_DEPLOY_KEY, NEXT_PUBLIC_FORMSPREE_PROJECT_ID
name: Deploy to Cloudflare (EXCS)

on:
  workflow_dispatch:

concurrency:
  group: cloudflare-excs
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Refuse the South West Collective account
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "CLOUDFLARE_ACCOUNT_ID is empty. Use the EXCS Cloudflare account ID, not South West Collective."
            exit 1
          fi
          if [ "$CLOUDFLARE_ACCOUNT_ID" = "d058c8ec4c5caeadbd55cf293f3d2d32" ]; then
            echo "CLOUDFLARE_ACCOUNT_ID is South West Collective. ExeHacks must deploy to the EXCS account."
            exit 1
          fi

      - name: Publish Formspree form
        run: npm run formspree:deploy
        env:
          FORMSPREE_DEPLOY_KEY: ${{ secrets.FORMSPREE_DEPLOY_KEY }}

      - name: Build static export
        run: npm run build
        env:
          NEXT_PUBLIC_FORMSPREE_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_FORMSPREE_PROJECT_ID }}

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
